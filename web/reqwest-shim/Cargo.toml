[package]
name = "arnis-web-reqwest"
version = "0.1.0"
edition = "2021"
description = "A blocking reqwest-compatible HTTP client that runs through the browser, for the Arnis web build"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

[package]
name = "arnis"
version = "3.3.0"
edition = "2021"
# Cargo only auto-detects a root build.rs, so the moved path has to be declared.
build = "src/build.rs"
description = "Arnis - Generate real life cities in Minecraft"
homepage = "https://github.com/louis-e/arnis"
repository = "https://github.com/louis-e/arnis"
license = "Apache-2.0"
readme = "README.md"

[profile.release]
lto = "thin"
overflow-checks = true

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-log", "tauri-plugin-shell", "tokio", "rfd", "tauri-build"]

[build-dependencies]
tauri-build = {version = "2", optional = true}

[dependencies]
base64 = "0.22.1"
bytes = "1"
byteorder = "1.5"
clap = { version = "4.6.0", features = ["derive", "env"] }
colored = "3.0.0"
crc = "3"
dda-voxelize = { git = "https://github.com/MIERUNE/dda-voxelize-rs", rev = "1e0844a873262f13b19a709e188a3df22a6fbf97" }
dirs = "6.0.0"
fastanvil = "0.32.0"
fastnbt = "2.6.0"
flate2 = "1.1"
fnv = "1.0.7"
fs2 = "0.4"
geo = "0.33.1"
gltf = { version = "1", default-features = false, features = ["import", "names", "utils", "KHR_materials_unlit"] }
image = "0.25"
include_dir = "0.7"
indicatif = "0.18.4"
itertools = "0.15.0"
log = "0.4.27"
once_cell = "1.21.3"
rand = { version = "0.9.3", features = ["std", "std_rng"] }
rand_chacha = "0.9"
rayon = "1.10.0"
semver = "1.0.27"
parquet = { version = "59", default-features = false, features = ["snap", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tiff = "0.11"
bedrockrs_level = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", rev = "7ef268b", package = "bedrockrs_level" }
bedrockrs_shared = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", rev = "7ef268b", package = "bedrockrs_shared" }
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }
vek = "0.17"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rusty-leveldb = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
quick-xml = "0.41.0"

# Native-only: the Tauri desktop shell, real sockets, a C allocator and TLS.
# The browser build (wasm32-unknown-emscripten) keeps the `gui` feature, so
# the app-mode code paths stay on, and swaps these for the browser; see
# web/README.md.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rfd = { version = "0.17.2", optional = true }
tauri = { version = "2", optional = true }
tauri-plugin-log = { version = "2.6.0", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tokio = { version = "1.48.0", features = ["full"], optional = true }
jsonwebtoken = "11.0.0"
mimalloc = "0.1"
reqwest = { version = "0.13.1", features = ["blocking", "json", "query", "gzip"] }

# Requests go through the browser's own networking.
[target.'cfg(target_os = "emscripten")'.dependencies]
arnis-web-reqwest = { path = "web/reqwest-shim" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.26.0"

[[example]]
name = "refresh_wikidata_index"
path = "assets/refresh_wikidata_index.rs"

# Freeze nbtx at the last pre-`NbtError`-rename commit; the pinned
# bedrockrs_proto_core leaves it unpinned so cargo update would break it.
[patch."https://github.com/bedrock-crustaceans/nbtx"]
nbtx = { git = "https://github.com/louis-e/nbtx", rev = "551c38ac74f2e68a07d3dbdd354faac0c0ac966e" }

# Two small patches for the WebAssembly build (web/README.md):
# - fs2 gains an Emscripten branch; native platforms are untouched.
# - bedrock-rs depends on jsonwebtoken 9 only to name an error type; the stub
#   keeps js-sys, which does not build for Emscripten, out of the graph.
[patch.crates-io]
fs2 = { path = "web/patches/fs2" }
jsonwebtoken = { path = "web/patches/jsonwebtoken" }
